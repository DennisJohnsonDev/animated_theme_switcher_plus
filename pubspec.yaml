name: animated_theme_switcher_plus
description: Animated theme switching for Flutter, with feathered circle and box reveals that expand from any tap position. Supports forward and reverse playback.
version: 1.0.0
homepage: https://github.com/DennisJohnsonDev/animated_theme_switcher_plus
repository: https://github.com/DennisJohnsonDev/animated_theme_switcher_plus
issue_tracker: https://github.com/DennisJohnsonDev/animated_theme_switcher_plus/issues

topics:
  - theme
  - animation
  - ui
  - dark-mode
  - material

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
